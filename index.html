<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TR Şirket / İkamet / Vergi Danışmanlığı</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Inter",sans-serif;font-size:14px;line-height:1.5;background:#f6f8fa;color:#1f2328;min-height:100vh}

/* Lang picker */
#lang-screen{position:fixed;inset:0;background:linear-gradient(135deg,#0969da 0%,#0550ae 100%);display:flex;align-items:center;justify-content:center;z-index:1000;flex-direction:column;gap:32px}
.lang-card{background:#fff;border-radius:16px;padding:48px 56px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25);min-width:380px}
.lang-title{font-size:22px;font-weight:600;color:#1f2328;margin-bottom:6px}
.lang-sub{font-size:14px;color:#656d76;margin-bottom:32px}
.lang-btn{display:flex;align-items:center;gap:14px;padding:14px 20px;border:1.5px solid #d0d7de;border-radius:10px;cursor:pointer;transition:all .15s;margin-bottom:10px;background:#fff;width:100%;font-family:inherit}
.lang-btn:hover{border-color:#0969da;background:#f0f6ff}
.lang-btn:last-child{margin-bottom:0}
.lang-flag{font-size:24px}
.lang-name{font-size:15px;font-weight:600;color:#1f2328}
.lang-native{font-size:13px;color:#656d76;margin-left:auto}

.layout{display:flex;min-height:100vh}
.sidebar{width:256px;background:#fff;border-right:1px solid #d0d7de;flex-shrink:0;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100}
.sbh{padding:16px 20px;border-bottom:1px solid #d0d7de}
.sbl{font-size:14px;font-weight:600;color:#0969da;line-height:1.3}
.sbt{font-size:11px;color:#656d76;margin-top:3px;text-transform:uppercase;letter-spacing:.05em}
.sbn{padding:12px 8px;flex:1}
.sbs{font-size:11px;font-weight:600;color:#656d76;text-transform:uppercase;letter-spacing:.06em;padding:8px 12px 4px}
.nl{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:6px;font-size:14px;color:#656d76;cursor:pointer;border:none;background:none;width:100%;font-family:inherit;text-align:left;transition:all .1s;margin-bottom:1px}
.nl:hover{background:#f6f8fa;color:#1f2328}
.nl.active{background:#dbeafe;color:#0969da;font-weight:500}
.nl .ti{font-size:16px}
.sbf{padding:14px 20px;border-top:1px solid #d0d7de;font-size:12px;color:#656d76;line-height:1.6}
.page{margin-left:256px;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid #d0d7de;padding:0 32px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;gap:16px;flex-shrink:0}
.tbl{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden}
#tbt{font-size:16px;font-weight:600;white-space:nowrap}
#tbs{font-size:13px;color:#656d76;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbr{display:flex;align-items:center;gap:8px;flex-shrink:0}
.body{padding:24px 60px;flex:1;display:flex;justify-content:center}
.inner{width:100%;max-width:760px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;font-size:14px;font-weight:500;border-radius:6px;border:1px solid #d0d7de;background:#f6f8fa;color:#1f2328;cursor:pointer;font-family:inherit;transition:background .1s;white-space:nowrap}
.btn:hover{background:#eaeef2}
.btn:active{transform:scale(.98)}
.btn-primary{background:#0969da;border-color:#0969da;color:#fff}
.btn-primary:hover{background:#0860ca;color:#fff}
.btn-success{background:#1a7f37;border-color:#1a7f37;color:#fff}
.btn-success:hover{background:#166a2e;color:#fff}
.btn-sm{padding:4px 12px;font-size:13px}
.btn-icon{padding:5px 8px}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:#f6f8fa;border-color:#d0d7de}
.card{background:#fff;border:1px solid #d0d7de;border-radius:8px;padding:24px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
.metric{background:#fff;border:1px solid #d0d7de;border-radius:8px;padding:20px 24px}
.metric-label{font-size:12px;font-weight:500;color:#656d76;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.metric-value{font-size:32px;font-weight:600;line-height:1}
.metric-value.blue{color:#0969da}
.metric-value.green{color:#1a7f37}
.record{background:#fff;border:1px solid #d0d7de;border-radius:8px;padding:16px 20px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:border-color .1s,box-shadow .1s;margin-bottom:8px}
.record:hover{border-color:#0969da;box-shadow:0 0 0 3px rgba(9,105,218,.1)}
.ava{width:40px;height:40px;border-radius:50%;background:#dbeafe;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#0969da;flex-shrink:0}
.ri{flex:1;min-width:0}
.rn{font-weight:600;font-size:15px;margin-bottom:2px}
.rs{font-size:13px;color:#656d76}
.rg{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.gt{background:#f6f8fa;border:1px solid #d0d7de;border-radius:20px;padding:2px 10px;font-size:12px;color:#656d76}
.pw{margin-top:6px}
.pb{height:4px;background:#e1e4e8;border-radius:2px;overflow:hidden;max-width:200px}
.pf{height:100%;background:#0969da;border-radius:2px}
.pl{font-size:12px;color:#656d76;margin-top:3px}
.rm{display:flex;align-items:center;gap:10px;flex-shrink:0}
.dt{font-size:13px;color:#656d76}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500}
.badge-green{background:#dafbe1;color:#1a7f37;border:1px solid #aceebb}
.badge-yellow{background:#fff8c5;color:#9a6700;border:1px solid #e3b341}
.badge-blue{background:#dbeafe;color:#0969da;border:1px solid #96c4f7}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:500}
.tag-req{background:#ffebe9;color:#cf222e;border:1px solid #ffcecb}
.tag-opt{background:#dafbe1;color:#1a7f37;border:1px solid #aceebb}
.tag-info{background:#dbeafe;color:#0969da;border:1px solid #96c4f7}
.alert{padding:12px 16px;border-radius:6px;font-size:14px;margin-bottom:16px;display:flex;align-items:flex-start;gap:10px;line-height:1.5}
.alert .ti{font-size:16px;flex-shrink:0;margin-top:1px}
.alert-warn{background:#fff8c5;color:#9a6700;border:1px solid #e3b341}
.alert-success{background:#dafbe1;color:#1a7f37;border:1px solid #aceebb}
.alert-error{background:#ffebe9;color:#cf222e;border:1px solid #ffcecb}
.alert-info{background:#dbeafe;color:#0969da;border:1px solid #96c4f7}
input,select,textarea{font-family:"Inter",inherit;font-size:14px;background:#fff;color:#1f2328;border:1px solid #d0d7de;border-radius:6px;padding:8px 12px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:#0969da;box-shadow:0 0 0 3px rgba(9,105,218,.15)}
textarea{resize:vertical;min-height:80px}
.fl{display:block;font-size:14px;font-weight:500;color:#1f2328;margin-bottom:6px}
.fg{margin-bottom:16px}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.steps{display:flex;background:#f6f8fa;border:1px solid #d0d7de;border-radius:8px;padding:4px;margin-bottom:16px;gap:4px}
.step{flex:1;text-align:center;padding:7px 8px;font-size:13px;color:#656d76;border-radius:6px;transition:all .15s;white-space:nowrap}
.step.active{background:#fff;color:#0969da;font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.step.done{color:#1a7f37}
.pill{display:inline-flex;align-items:center;padding:6px 14px;border:1px solid #d0d7de;border-radius:20px;cursor:pointer;font-size:13px;background:#f6f8fa;color:#656d76;transition:all .1s;user-select:none;font-family:inherit;margin:0 6px 6px 0}
.pill:hover{border-color:#0969da;color:#0969da;background:#fff}
.pill.sel{background:#dbeafe;border-color:#0969da;color:#0969da;font-weight:500}
.ci{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid #d0d7de}
.ci:last-child{border-bottom:none}
.ci input[type=checkbox]{width:16px;height:16px;flex-shrink:0;margin-top:2px;accent-color:#0969da;cursor:pointer}
.it{font-size:14px}
.in{font-size:13px;color:#656d76;margin-top:3px}
.sh{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;color:#0969da;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #d0d7de}
.sh .ti{font-size:18px}
.fnav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;padding-top:20px;border-top:1px solid #d0d7de}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.da{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.dv{border:none;border-top:1px solid #d0d7de;margin:14px 0}
.dk{padding:6px 16px 6px 0;color:#656d76;font-size:13px;white-space:nowrap;vertical-align:top}
.dv2{padding:6px 0;font-size:14px}
.dl{font-size:12px;font-weight:600;color:#656d76;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
.clh{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.stabs{display:flex;border-bottom:2px solid #d0d7de;margin-bottom:24px}
.stab{padding:10px 20px;font-size:14px;cursor:pointer;border:none;background:none;color:#656d76;border-bottom:2px solid transparent;margin-bottom:-2px;font-family:inherit;transition:all .1s}
.stab:hover{color:#1f2328}
.stab.active{color:#0969da;border-bottom-color:#0969da;font-weight:500}
.ai{display:flex;align-items:flex-start;gap:10px;padding:12px 16px;border:1px solid #d0d7de;border-radius:6px;margin-bottom:8px;background:#fff}
.ai:hover{border-color:#0969da}
.empty{text-align:center;padding:60px 20px;color:#656d76}
.empty .ti{font-size:56px;display:block;margin-bottom:16px;opacity:.3}
.empty-title{font-size:18px;font-weight:600;color:#1f2328;margin-bottom:8px}
.empty-sub{font-size:14px;margin-bottom:24px}
hr{border:none;border-top:1px solid #d0d7de;margin:14px 0}
pre{font-family:monospace;font-size:12px;white-space:pre-wrap;word-break:break-all}
</style>

]},{"id":"s5","title":"Steuerbefreiung & Optimierung","icon":"ti-receipt-tax","items":[{"id":"i40","text":"Ausländischer Einkommensnachweis / unterzeichnete Verträge","tag":"req","note":"Zum Nachweis der Nutzung der Dienstleistung im Ausland","cond":"q3:Steueroptimierung"},{"id":"i41","text":"Zahlungsbelege ausländischer Kunden (SWIFT / Überweisung)","tag":"req","note":"","cond":"q3:Steueroptimierung"},{"id":"i42","text":"Deviseneinkommen-Kontoauszug","tag":"req","note":"","cond":"q3:Steueroptimierung"},{"id":"i43","text":"50% Körperschaftsteuer-Ermäßigungsantrag (ausländische Dienstleistung)","tag":"req","note":"Dienstleistung muss ausschließlich im Ausland genutzt werden","cond":"q3:Steueroptimierung"},{"id":"i44","text":"Doppelbesteuerungsabkommen-Bewertung","tag":"opt","note":"Türkei hat Abkommen mit 90+ Ländern unterzeichnet","cond":"q3:Steueroptimierung"},{"id":"i45","text":"Steueroptimierungsbericht des Steuerberaters","tag":"opt","note":"","cond":"q3:Steueroptimierung"}]},{"id":"s6","title":"Vermögensfrieden","icon":"ti-safe","items":[{"id":"i50","text":"Ausländisches Vermögensinventar (Bank, Immobilien, Wertpapiere)","tag":"req","note":"","cond":"q3:Vermögensfrieden"},{"id":"i51","text":"Nachweise über die Herkunft des Vermögens","tag":"req","note":"Kontoauszüge, Grundbuchauszüge, Aktien usw.","cond":"q3:Vermögensfrieden"},{"id":"i52","text":"Türkisches Bankkonto (für Überweisungen)","tag":"req","note":"","cond":"q3:Vermögensfrieden"},{"id":"i53","text":"Finanzamt-Vermögensfrieden-Erklärungsformular","tag":"req","note":"","cond":"q3:Vermögensfrieden"},{"id":"i54","text":"3% Steuerquittung","tag":"req","note":"Aktuellen Satz und Frist bestätigen","cond":"q3:Vermögensfrieden"},{"id":"i55","text":"Erklärung und Unterschrift des Steuerberaters","tag":"req","note":"","cond":"q3:Vermögensfrieden"}]},{"id":"s7","title":"Allgemeine Kontrollen","icon":"ti-clipboard-check","items":[{"id":"i60","text":"Apostille / Konsulatsbeglaubigung aller ausländischen Dokumente"," <script>
var I18N=JSON.parse(document.getElementById("i18ndata").textContent);
var QUESTIONS=JSON.parse(document.getElementById("questionsdata").textContent);
var SECTIONS=JSON.parse(document.getElementById("sectionsdata").textContent);

var cfg, recs, view, cur, authed, atab, lang;
var KC="tr8c", KR="tr8r", KL="tr8l";

function boot(){
  lang = localStorage.getItem(KL) || null;
  if(!lang){ showLangPicker(); return; }
  startApp();
}

function showLangPicker(){
  document.getElementById("lang-screen").style.display="flex";
  document.getElementById("app-shell").style.display="none";
}

function pickLang(l){
  lang = l;
  localStorage.setItem(KL, l);
  document.getElementById("lang-screen").style.display="none";
  document.getElementById("app-shell").style.display="flex";
  startApp();
}

function startApp(){
  var T=I18N[lang], Q=QUESTIONS[lang], S=SECTIONS[lang];
  // Update static UI text
  document.getElementById("brand-name").textContent=T.brand;
  document.getElementById("brand-tagline").textContent=T.tagline;
  document.getElementById("nav-label-records").textContent=T.leads;
  document.getElementById("nav-label-admin").textContent=T.admin;
  document.getElementById("sb-footer").innerHTML=T.footer.replace('\n','<br>');
  document.getElementById("menu-label").textContent=T.menu;

  try{cfg=JSON.parse(localStorage.getItem(KC+lang));}catch(x){cfg=null;}
  if(!cfg){
    var base=JSON.parse(document.getElementById("appdata").textContent);
    cfg=JSON.parse(JSON.stringify(base));
    cfg.questions=JSON.parse(JSON.stringify(Q));
    cfg.sections=JSON.parse(JSON.stringify(S));
  }
  try{recs=JSON.parse(localStorage.getItem(KR));}catch(x){recs=null;}
  if(!recs)recs=[];
  view="records";cur=null;authed=false;atab="questions";
  render();
}

function t(k){ return (I18N[lang]||I18N["tr"])[k]||k; }
function sc(){localStorage.setItem(KC+lang,JSON.stringify(cfg));}
function sr(){localStorage.setItem(KR,JSON.stringify(recs));}
function uid(){return "u"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function e(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function setTop(title,sub,acts){
  document.getElementById("tbt").textContent=title;
  var s=document.getElementById("tbs");
  s.textContent=sub||""; s.style.display=sub?"":"none";
  document.getElementById("tba").innerHTML=acts||"";
}
function go(v){
  view=v;
  document.querySelectorAll(".nl").forEach(function(n){n.classList.remove("active");});
  var n=document.getElementById("nav-"+v);if(n)n.classList.add("active");
  render();
}
function tryAdmin(){
  if(!authed){var p=prompt(t("admin_pass")+":");if(!p)return;if(p!==cfg.adminPass){alert(t("admin_wrong"));return;}authed=true;}
  view="admin";
  document.querySelectorAll(".nl").forEach(function(n){n.classList.remove("active");});
  document.getElementById("nav-admin").classList.add("active");
  render();
}
function mc(it,ans){
  if(!it.cond)return true;
  return it.cond.split("|").some(function(p){
    var a=p.split(":");var q=a[0];var v=a.slice(1).join(":");
    var x=ans[q];if(!x)return false;
    return Array.isArray(x)?x.indexOf(v)>-1:x===v;
  });
}
function fs(ans){
  return cfg.sections.map(function(s){
    return {id:s.id,title:s.title,icon:s.icon,items:s.items.filter(function(i){return mc(i,ans);})};
  }).filter(function(s){return s.items.length>0;});
}
function av(n){return (n||"?").split(" ").map(function(w){return w[0]||"";}).slice(0,2).join("").toUpperCase();}
function tl(t2){return t2==="req"?t("tag_req"):t2==="opt"?t("tag_opt"):t("tag_info");}
function pg(r){
  var s=fs(r.answers||{});var a=s.length?s:cfg.sections;var tot=0,c=0;
  a.forEach(function(x){x.items.forEach(function(i){tot++;if(r.checklist&&r.checklist[i.id])c++;});});
  return{t:tot,c:c};
}
function render(){
  var el=document.getElementById("app");
  if(view==="records"){
    setTop(t("leads"),"","<button class='btn btn-primary' onclick='newRec()'><i class='ti ti-plus'></i> "+t("new_record")+"</button>");
    el.innerHTML=rList();
  }else if(view==="form"){
    setTop(t("new_record"),e(cur.contact.name||""),"");
    el.innerHTML=rForm();
  }else if(view==="detail"){
    setTop(e(cur.contact.name),e(cur.contact.email),"<div style='display:flex;gap:8px'><button class='btn' onclick='editCur()'><i class='ti ti-edit'></i> "+t("edit")+"</button><button class='btn btn-success' onclick='sendWH()'><i class='ti ti-send'></i> "+t("send")+"</button></div>");
    el.innerHTML=rDetail();
  }else if(view==="admin"){
    setTop(t("admin"),t("questions_tab")+" · "+t("checklist_tab"),"<span class='badge badge-blue'><i class='ti ti-shield-check'></i> Admin</span>");
    el.innerHTML=rAdmin();
  }
  attachEv();
}
function rList(){
  var total=recs.length,sent=recs.filter(function(r){return r.sent;}).length;
  if(!total)return "<div class='empty'><i class='ti ti-users'></i><div class='empty-title'>"+t("no_records")+"</div><div class='empty-sub'>"+t("no_records_sub")+"</div><button class='btn btn-primary' style='margin:0 auto' onclick='newRec()'><i class='ti ti-plus'></i> "+t("create_first")+"</button></div>";
  var h="<div class='metrics'><div class='metric'><div class='metric-label'>"+t("total")+"</div><div class='metric-value'>"+total+"</div></div><div class='metric'><div class='metric-label'>"+t("sent")+"</div><div class='metric-value green'>"+sent+"</div></div><div class='metric'><div class='metric-label'>"+t("pending")+"</div><div class='metric-value blue'>"+(total-sent)+"</div></div></div>";
  recs.forEach(function(r){
    var p=pg(r),pct=p.t?Math.round(p.c/p.t*100):0;
    var goals=[].concat(r.answers&&r.answers.q3?r.answers.q3:[]);
    h+="<div class='record' onclick='openRec(\""+r.id+"\")'><div class='ava'>"+e(av(r.contact.name))+"</div><div class='ri'><div class='rn'>"+e(r.contact.name||"")+"</div><div class='rs'>"+e(r.contact.email)+(r.contact.phone?" · "+e(r.contact.phone):"")+(r.contact.city?" · "+e(r.contact.city):"")+"</div>";
    if(goals.length)h+="<div class='rg'>"+goals.map(function(g){return "<span class='gt'>"+e(g)+"</span>";}).join("")+"</div>";
    h+="<div class='pw'><div class='pb'><div class='pf' style='width:"+pct+"%'></div></div><div class='pl'>"+p.c+" / "+p.t+" "+t("documents")+" · "+pct+"%</div></div></div><div class='rm'><span class='badge "+(r.sent?"badge-green":"badge-yellow")+"'>"+(r.sent?t("sent"):t("pending"))+"</span><span class='dt'>"+new Date(r.createdAt).toLocaleDateString("tr-TR",{day:"2-digit",month:"short",year:"numeric"})+"</span><button class='btn btn-sm btn-ghost btn-icon' onclick='event.stopPropagation();editId(\""+r.id+"\")'><i class='ti ti-edit'></i></button><button class='btn btn-sm btn-ghost btn-icon' style='color:#cf222e' onclick='event.stopPropagation();delRec(\""+r.id+"\")'><i class='ti ti-trash'></i></button></div></div>";
  });
  return h;
}
function newRec(){
  cur={id:uid(),createdAt:new Date().toISOString(),contact:{name:"",email:"",phone:"",city:"",notes:""},answers:{},checklist:{},sent:false,step:"contact"};
  view="form";render();
}
function rForm(){
  var steps=["contact","questions","checklist"],si=steps.indexOf(cur.step);
  var labels=[t("step1"),t("step2"),t("step3")];
  var sh="<div class='steps'>";labels.forEach(function(l,i){sh+="<div class='step"+(i===si?" active":i<si?" done":"")+"'>"+(i<si?"✓ ":"")+(i+1)+". "+l+"</div>";});sh+="</div>";
  var body="";
  if(cur.step==="contact"){
    body="<div class='card'><div class='fg2'><div class='fg'><label class='fl'>"+t("full_name")+" *</label><input id='fn' value='"+e(cur.contact.name)+"' placeholder='"+(lang==="de"?"Hans Müller":lang==="en"?"John Smith":"Ahmet Yılmaz")+"'></div><div class='fg'><label class='fl'>"+t("email")+" *</label><input id='fe' type='email' value='"+e(cur.contact.email)+"' placeholder='"+(lang==="de"?"hans@beispiel.de":lang==="en"?"john@example.com":"ahmet@ornek.com")+"'></div><div class='fg'><label class='fl'>"+t("phone")+"</label><input id='fp' value='"+e(cur.contact.phone)+"' placeholder='"+(lang==="de"?"+49 151 000 00 00":lang==="en"?"+44 20 0000 0000":"+90 500 000 00 00")+"'></div><div class='fg'><label class='fl'>"+t("city")+"</label><input id='fc' value='"+e(cur.contact.city||"")+"' placeholder='"+(lang==="de"?"Berlin / Deutschland":lang==="en"?"London / Germany":"İstanbul / Almanya")+"'></div></div><div class='fg'><label class='fl'>"+t("notes")+"</label><textarea id='fn2' placeholder='"+t("notes_ph")+"'>"+e(cur.contact.notes)+"</textarea></div></div>";
  }else if(cur.step==="questions"){
    cfg.questions.forEach(function(q){
      body+="<div class='card' style='margin-bottom:8px;padding:14px 16px'><div style='font-weight:600;font-size:14px;margin-bottom:10px;color:#1f2328'>"+e(q.text)+"</div><div>";
      q.options.forEach(function(opt){var ans=cur.answers[q.id],sel=Array.isArray(ans)?ans.indexOf(opt)>-1:ans===opt;body+="<span class='pill"+(sel?" sel":"")+"' data-qid='"+q.id+"' data-val='"+e(opt)+"' data-type='"+q.type+"'>"+e(opt)+"</span>";});
      body+="</div></div>";
    });
  }else{
    var secs=fs(cur.answers),all=secs.length?secs:cfg.sections;
    all.forEach(function(sec){
      body+="<div class='card' style='margin-bottom:12px'><div class='sh'><i class='ti "+(sec.icon||"ti-list")+"'></i>"+e(sec.title)+"</div>";
      sec.items.forEach(function(it){body+="<div class='ci'><input type='checkbox' data-iid='"+it.id+"'"+(cur.checklist[it.id]?" checked":"")+">"+"<div style='flex:1'><div class='it'>"+e(it.text)+"</div>"+(it.note?"<div class='in'>"+e(it.note)+"</div>":"")+"</div><span class='tag tag-"+it.tag+"'>"+tl(it.tag)+"</span></div>";});
      body+="</div>";
    });
  }

}
function fBack(){var s=["contact","questions","checklist"],i=s.indexOf(cur.step);if(i>0){cur.step=s[i-1];render();}}

    sec.items.forEach(function(it,ii){h+="<div class='ai'><div style='flex:1'><div class='it'>"+e(it.text)+"</div>"+(it.note?"<div class='in'>"+e(it.note)+"</div>":"")+(it.cond?"<div style='font-size:12px;color:#656d76;margin-top:3px'><i class='ti ti-filter'></i> "+e(it.cond)+"</div>":"")+"</div><span class='tag tag-"+it.tag+"'>"+tl(it.tag)+"</span><button class='btn btn-sm btn-ghost btn-icon' onclick='editItem("+si+","+ii+")'><i class='ti ti-edit'></i></button><button class='btn btn-sm btn-ghost btn-icon' style='color:#cf222e' onclick='delItem("+si+","+ii+")'><i class='ti ti-trash'></i></button></div>";});
    h+="</div>";

function rAW(){
  return "<div class='card' style='margin-bottom:16px'><div style='font-weight:600;font-size:15px;margin-bottom:16px'>"+t("webhook_tab")+"</div><div class='fg'><label class='fl'>"+t("webhook_url")+"</label><input id='whu' value='"+e(cfg.webhookUrl)+"' placeholder='https://hooks.zapier.com/...'></div><div style='font-size:13px;color:#656d76;margin-bottom:16px;line-height:1.6'>"+t("webhook_desc")+"</div><div style='display:flex;gap:8px'><button class='btn btn-primary' onclick='saveWH()'><i class='ti ti-device-floppy'></i> "+t("webhook_save")+"</button><button class='btn' onclick='testWH()'><i class='ti ti-send'></i> "+t("webhook_test")+"</button></div><div id='whs' style='margin-top:12px'></div></div>"
  +"<div class='card' style='margin-bottom:16px'><div style='font-weight:600;font-size:15px;margin-bottom:16px'>"+t("security")+"</div><div class='fg' style='max-width:320px'><label class='fl'>"+t("admin_pass")+"</label><input id='adpw' type='password' value='"+e(cfg.adminPass)+"'></div><button class='btn btn-primary' onclick='savePW()'><i class='ti ti-device-floppy'></i> "+t("update_pass")+"</button></div>"
  +"<div class='card'><div style='font-weight:600;font-size:15px;margin-bottom:12px'>"+t("payload_example")+"</div><pre style='background:#f6f8fa;border:1px solid #d0d7de;border-radius:6px;padding:16px;overflow-x:auto'>"+e(JSON.stringify({record_id:"u1a2b3",contact:{name:"Ahmet Yılmaz",email:"ahmet@test.com"},answers:{q1:"TC vatandaşı",q3:["Şirket kurmak"]},checklist_summary:{checked:8,total:14}},null,2))+"</pre></div>";
}
function addQ(){var tx=prompt(t("q_text"));if(!tx)return;var m=confirm(t("multi_select"));cfg.questions.push({id:uid(),text:tx,type:m?"multi":"single",options:[]});sc();render();}

function delQ(qi){if(!confirm(t("confirm_delete_q")))return;cfg.questions.splice(qi,1);sc();render();}
function addOpt(qi){var v=prompt(t("add_option").replace("+ ",""));if(!v)return;cfg.questions[qi].options.push(v);sc();render();}

function addSec(){var tx=prompt(t("section_title"));if(!tx)return;cfg.sections.push({id:uid(),title:tx,icon:"ti-list",items:[]});sc();render();}
function delSec(si){if(!confirm(t("confirm_delete_section")))return;cfg.sections.splice(si,1);sc();render();}
function addItem(si){
  var tx=prompt(t("item_text"));if(!tx)return;
  var tag=prompt(t("item_tag")+" (req/opt/info):","req")||"req";
  var note=prompt(t("item_note")+":");
  var cond=prompt(t("item_cond")+":");
  cfg.sections[si].items.push({id:uid(),text:tx,tag:tag,note:note||"",cond:cond||""});sc();render();

    +"<div style='font-size:16px;font-weight:600;margin-bottom:20px'>"+t("edit_item")+"</div>"
    +"<div style='margin-bottom:14px'><label style='display:block;font-size:13px;font-weight:500;margin-bottom:5px'>"+t("item_text")+"</label>"
    +"<input id='ei_text' value='"+e(it.text)+"' style='width:100%;font-family:Inter,sans-serif;font-size:14px;padding:8px 12px;border:1px solid #d0d7de;border-radius:6px;outline:none'></div>"
    +"<div style='margin-bottom:14px'><label style='display:block;font-size:13px;font-weight:500;margin-bottom:5px'>"+t("item_note")+"</label>"
    +"<input id='ei_note' value='"+e(it.note||"")+"' placeholder='"+t("item_note_ph")+"' style='width:100%;font-family:Inter,sans-serif;font-size:14px;padding:8px 12px;border:1px solid #d0d7de;border-radius:6px;outline:none'></div>"
    +"<div style='margin-bottom:14px'><label style='display:block;font-size:13px;font-weight:500;margin-bottom:5px'>"+t("item_tag")+"</label>"
    +"<select id='ei_tag' style='width:100%;font-family:Inter,sans-serif;font-size:14px;padding:8px 12px;border:1px solid #d0d7de;border-radius:6px;outline:none'>"
    +"<option value='req'"+(it.tag==="req"?" selected":"")+" >"+t("tag_req")+"</option>"
    +"<option value='opt'"+(it.tag==="opt"?" selected":"")+" >"+t("tag_opt")+"</option>"
    +"<option value='info'"+(it.tag==="info"?" selected":"")+" >"+t("tag_info")+"</option>"
    +"</select></div>"
    +"<div style='margin-bottom:20px'><label style='display:block;font-size:13px;font-weight:500;margin-bottom:5px'>"+t("item_cond")+" <span style=\\'font-weight:400;color:#656d76\\'>"+t("item_cond_hint")+"</span></label>"
    +"<input id='ei_cond' value='"+e(it.cond||"")+"' placeholder='"+t("item_cond_ph")+"' style='width:100%;font-family:Inter,sans-serif;font-size:14px;padding:8px 12px;border:1px solid #d0d7de;border-radius:6px;outline:none'></div>"
    +"<div style='display:flex;justify-content:flex-end;gap:10px'>"
    +"<button onclick='this.closest(\\'[style*=fixed]\\').remove()' style='padding:8px 18px;font-size:14px;font-family:Inter,sans-serif;border:1px solid #d0d7de;background:#f6f8fa;border-radius:6px;cursor:pointer'>"+t("cancel")+"</button>"
    +"<button id='ei_save' style='padding:8px 18px;font-size:14px;font-family:Inter,sans-serif;border:1px solid #0969da;background:#0969da;color:#fff;border-radius:6px;cursor:pointer'>"+t("save")+"</button>"
    +"</div></div>";

function saveWH(){cfg.webhookUrl=document.getElementById("whu").value.trim();sc();alert(t("saved"));}
function savePW(){var p=document.getElementById("adpw").value.trim();if(!p){alert(t("empty_pass"));return;}cfg.adminPass=p;sc();alert(t("updated"));}
async function testWH(){
  var url=document.getElementById("whu").value.trim();if(!url){alert(t("webhook_url")+" ?");return;}
  var el=document.getElementById("whs");el.innerHTML="<div class='alert alert-info'><i class='ti ti-loader'></i> "+t("webhook_sending")+"</div>";
  try{await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({test:true,ts:new Date().toISOString()}),mode:"no-cors"});el.innerHTML="<div class='alert alert-success'><i class='ti ti-check'></i> "+t("webhook_sent")+"</div>";}
  catch(ex){el.innerHTML="<div class='alert alert-error'><i class='ti ti-x'></i> "+t("webhook_error")+": "+ex.message+"</div>";}
}
async function sendWH(){
  var r=cur,el=document.getElementById("ss");
  if(!cfg.webhookUrl){el.innerHTML="<div class='alert alert-warn'><i class='ti ti-alert-triangle'></i> "+t("webhook_missing")+"</div>";return;}
  el.innerHTML="<div class='alert alert-info'><i class='ti ti-loader'></i> "+t("webhook_sending")+"</div>";
  var p=pg(r),items={};cfg.sections.forEach(function(s){s.items.forEach(function(it){items[it.id]={text:it.text,tag:it.tag,checked:!!(r.checklist&&r.checklist[it.id])};});});
  try{
    await fetch(cfg.webhookUrl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({record_id:r.id,created_at:r.createdAt,sent_at:new Date().toISOString(),lang:lang,contact:r.contact,answers:r.answers,checklist_summary:{checked:p.c,total:p.t},checklist_items:items}),mode:"no-cors"});
    r.sent=true;r.sentAt=new Date().toISOString();sr();
    el.innerHTML="<div class='alert alert-success'><i class='ti ti-check'></i> "+t("webhook_sent")+" — "+new Date().toLocaleTimeString()+"</div>";
  }catch(ex){el.innerHTML="<div class='alert alert-error'><i class='ti ti-x'></i> "+t("webhook_error")+": "+ex.message+"</div>";}
}
function attachEv(){
  document.querySelectorAll(".pill").forEach(function(el){
    el.addEventListener("click",function(){
      var qid=el.dataset.qid,val=el.dataset.val,type=el.dataset.type;
      if(type==="single"){cur.answers[qid]=val;el.parentNode.querySelectorAll(".pill").forEach(function(p){p.classList.remove("sel");});el.classList.add("sel");}
      else{if(!cur.answers[qid])cur.answers[qid]=[];var arr=cur.answers[qid],i=arr.indexOf(val);if(i>-1){arr.splice(i,1);el.classList.remove("sel");}else{arr.push(val);el.classList.add("sel");}}
    });
  });
  document.querySelectorAll("input[data-iid]").forEach(function(el){
    el.addEventListener("change",function(){
      var iid=el.dataset.iid,rid=el.dataset.rid;
      if(rid){var rec=recs.find(function(r){return r.id===rid;});if(rec){rec.checklist[iid]=el.checked;sr();}}
      else if(cur)cur.checklist[iid]=el.checked;
    });
  });
}
