<script>

var cfg, recs, view, cur, authed, atab;
var KC="tr7c", KR="tr7r";

function boot(){
  var raw=document.getElementById("appdata").textContent;
  var D=JSON.parse(raw);
  try{cfg=JSON.parse(localStorage.getItem(KC));}catch(x){cfg=null;}
  if(!cfg)cfg=JSON.parse(JSON.stringify(D));
  try{recs=JSON.parse(localStorage.getItem(KR));}catch(x){recs=null;}
  if(!recs)recs=[];
  view="records";cur=null;authed=false;atab="questions";
  render();
}
function sc(){localStorage.setItem(KC,JSON.stringify(cfg));}
function sr(){localStorage.setItem(KR,JSON.stringify(recs));}
function uid(){return "u"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function e(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function top(title,sub,acts){
  document.getElementById("tbt").textContent=title;
  var s=document.getElementById("tbs");
  s.textContent=sub||"";
  s.style.display=sub?"":"none";
  document.getElementById("tba").innerHTML=acts||"";
}
function go(v){
  view=v;
  document.querySelectorAll(".nl").forEach(function(n){n.classList.remove("active");});
  var n=document.getElementById("nav-"+v);if(n)n.classList.add("active");
  render();
}
function tryAdmin(){
  if(!authed){var p=prompt("Admin şifresi:");if(!p)return;if(p!==cfg.adminPass){alert("Yanlış şifre.");return;}authed=true;}
  view="admin";
  document.querySelectorAll(".nl").forEach(function(n){n.classList.remove("active");});
  document.getElementById("nav-admin").classList.add("active");
  render();
}
function mc(it,ans){
  if(!it.cond)return true;
  return it.cond.split("|").some(function(p){
    var a=p.split(":");var q=a[0];var v=a.slice(1).join(":");
    var x=ans[q];if(!x)return false;
    return Array.isArray(x)?x.indexOf(v)>-1:x===v;
  });
}
function fs(ans){
  return cfg.sections.map(function(s){
    return {id:s.id,title:s.title,icon:s.icon,items:s.items.filter(function(i){return mc(i,ans);})};
  }).filter(function(s){return s.items.length>0;});
}
function av(n){return (n||"?").split(" ").map(function(w){return w[0]||"";}).slice(0,2).join("").toUpperCase();}
function tl(t){return t==="req"?"Zorunlu":t==="opt"?"Önerilen":"Bilgi";}
function pg(r){
  var s=fs(r.answers||{});var a=s.length?s:cfg.sections;var t=0,c=0;
  a.forEach(function(x){x.items.forEach(function(i){t++;if(r.checklist&&r.checklist[i.id])c++;});});
  return{t:t,c:c};
}
function render(){
  var el=document.getElementById("app");
  if(view==="records"){
    top("Kayıtlar","","<button class='btn btn-primary' onclick='newRec()'><i class='ti ti-plus'></i> Yeni kayıt</button>");
    el.innerHTML=rList();
  }else if(view==="form"){
    top("Yeni Kayıt",e(cur.contact.name||"İsimsiz"),"");
    el.innerHTML=rForm();
  }else if(view==="detail"){
    top(e(cur.contact.name),e(cur.contact.email),"<div style='display:flex;gap:8px'><button class='btn' onclick='editCur()'><i class='ti ti-edit'></i> Düzenle</button><button class='btn btn-success' onclick='sendWH()'><i class='ti ti-send'></i> Verileri gönder</button></div>");
    el.innerHTML=rDetail();
  }else if(view==="admin"){
    top("Yönetim","Sorular, check list ve ayarlar","<span class='badge badge-blue'><i class='ti ti-shield-check'></i> Admin</span>");
    el.innerHTML=rAdmin();
  }
  attachEv();
}
function rList(){
  var total=recs.length,sent=recs.filter(function(r){return r.sent;}).length;
  if(!total)return "<div class='empty'><i class='ti ti-users'></i><div class='empty-title'>Henüz kayıt yok</div><div class='empty-sub'>Yeni kayıt oluşturarak başlayın</div><button class='btn btn-primary' style='margin:0 auto' onclick='newRec()'><i class='ti ti-plus'></i> Yeni kayıt oluştur</button></div>";
  var h="<div class='metrics'><div class='metric'><div class='metric-label'>Toplam</div><div class='metric-value'>"+total+"</div></div><div class='metric'><div class='metric-label'>Gönderildi</div><div class='metric-value green'>"+sent+"</div></div><div class='metric'><div class='metric-label'>Bekliyor</div><div class='metric-value blue'>"+(total-sent)+"</div></div></div>";
  recs.forEach(function(r){
    var p=pg(r),pct=p.t?Math.round(p.c/p.t*100):0;
    var goals=[].concat(r.answers&&r.answers.q3?r.answers.q3:[]);
    h+="<div class='record' onclick='openRec(\""+r.id+"\")'>";
    h+="<div class='ava'>"+e(av(r.contact.name))+"</div>";
    h+="<div class='ri'>";
    h+="<div class='rn'>"+e(r.contact.name||"İsimsiz")+"</div>";
    h+="<div class='rs'>"+e(r.contact.email)+(r.contact.phone?" · "+e(r.contact.phone):"")+(r.contact.city?" · "+e(r.contact.city):"")+"</div>";
    if(goals.length)h+="<div class='rg'>"+goals.map(function(g){return "<span class='gt'>"+e(g)+"</span>";}).join("")+"</div>";
    h+="<div class='pw'><div class='pb'><div class='pf' style='width:"+pct+"%'></div></div><div class='pl'>"+p.c+" / "+p.t+" belge · "+pct+"%</div></div>";
    h+="</div><div class='rm'>";
    h+="<span class='badge "+(r.sent?"badge-green":"badge-yellow")+"'>"+(r.sent?"Gönderildi":"Bekliyor")+"</span>";
    h+="<span class='dt'>"+new Date(r.createdAt).toLocaleDateString("tr-TR",{day:"2-digit",month:"short",year:"numeric"})+"</span>";
    h+="<button class='btn btn-sm btn-ghost btn-icon' onclick='event.stopPropagation();editId(\""+r.id+"\")'><i class='ti ti-edit'></i></button>";
    h+="<button class='btn btn-sm btn-ghost btn-icon' style='color:#cf222e' onclick='event.stopPropagation();delRec(\""+r.id+"\")'><i class='ti ti-trash'></i></button>";
    h+="</div></div>";
  });
  return h;
}
function newRec(){
  cur={id:uid(),createdAt:new Date().toISOString(),contact:{name:"",email:"",phone:"",city:"",notes:""},answers:{},checklist:{},sent:false,step:"contact"};
  view="form";render();
}
function rForm(){
  var steps=["contact","questions","checklist"],si=steps.indexOf(cur.step);
  var labels=["İletişim bilgileri","Müşteri soruları","Check list"];
  var sh="<div class='steps'>";
  labels.forEach(function(l,i){sh+="<div class='step"+(i===si?" active":i<si?" done":"")+"'>"+(i<si?"✓ ":"")+(i+1)+". "+l+"</div>";});
  sh+="</div>";
  var body="";
  if(cur.step==="contact"){
    body="<div class='card'><div class='fg2'><div class='fg'><label class='fl'>Ad Soyad *</label><input id='fn' value='"+e(cur.contact.name)+"' placeholder='Ahmet Yılmaz'></div><div class='fg'><label class='fl'>E-posta *</label><input id='fe' type='email' value='"+e(cur.contact.email)+"' placeholder='ahmet@ornek.com'></div><div class='fg'><label class='fl'>Telefon</label><input id='fp' value='"+e(cur.contact.phone)+"' placeholder='+90 500 000 00 00'></div><div class='fg'><label class='fl'>Şehir / Ülke</label><input id='fc' value='"+e(cur.contact.city||"")+"' placeholder='İstanbul / Almanya'></div></div><div class='fg'><label class='fl'>Notlar</label><textarea id='fn2' placeholder='Ek notlar...'>"+e(cur.contact.notes)+"</textarea></div></div>";
  }else if(cur.step==="questions"){
    cfg.questions.forEach(function(q){
      body+="<div class='card' style='margin-bottom:12px'><div class='ql'>"+e(q.text)+"</div><div>";
      q.options.forEach(function(opt){var ans=cur.answers[q.id],sel=Array.isArray(ans)?ans.indexOf(opt)>-1:ans===opt;body+="<span class='pill"+(sel?" sel":"")+"' data-qid='"+q.id+"' data-val='"+e(opt)+"' data-type='"+q.type+"'>"+e(opt)+"</span>";});
      body+="</div></div>";
    });
  }else{
    var secs=fs(cur.answers),all=secs.length?secs:cfg.sections;
    all.forEach(function(sec){
      body+="<div class='card' style='margin-bottom:12px'><div class='sh'><i class='ti "+(sec.icon||"ti-list")+"'></i>"+e(sec.title)+"</div>";
      sec.items.forEach(function(it){body+="<div class='ci'><input type='checkbox' data-iid='"+it.id+"'"+(cur.checklist[it.id]?" checked":"")+">"+"<div style='flex:1'><div class='it'>"+e(it.text)+"</div>"+(it.note?"<div class='in'>"+e(it.note)+"</div>":"")+"</div><span class='tag tag-"+it.tag+"'>"+tl(it.tag)+"</span></div>";});
      body+="</div>";
    });
  }
  var nav="<div class='fnav'><button class='btn btn-ghost' onclick='go(\"records\")'><i class='ti ti-x'></i> İptal</button><div style='display:flex;gap:8px'>"+(si>0?"<button class='btn' onclick='fBack()'><i class='ti ti-arrow-left'></i> Geri</button>":"")+"<button class='btn btn-primary' onclick='fNext()'>"+(si===2?"<i class='ti ti-device-floppy'></i> Kaydet":"İleri <i class='ti ti-arrow-right'></i>")+"</button></div></div>";
  return sh+body+nav;
}
function fBack(){var s=["contact","questions","checklist"],i=s.indexOf(cur.step);if(i>0){cur.step=s[i-1];render();}}
function fNext(){
  var s=["contact","questions","checklist"],i=s.indexOf(cur.step);
  if(i===0){
    var n=document.getElementById("fn").value.trim(),em=document.getElementById("fe").value.trim();
    if(!n||!em){alert("Ad soyad ve e-posta zorunludur.");return;}
    cur.contact={name:n,email:em,phone:document.getElementById("fp").value.trim(),city:document.getElementById("fc").value.trim(),notes:document.getElementById("fn2").value.trim()};
    cur.step="questions";render();
  }else if(i===1){cur.step="checklist";render();}
  else{var ex=recs.findIndex(function(r){return r.id===cur.id;});if(ex>-1)recs[ex]=cur;else recs.unshift(cur);sr();view="detail";render();}
}
function openRec(id){cur=recs.find(function(r){return r.id===id;});view="detail";render();}
function editCur(){cur.step="contact";view="form";render();}
function editId(id){cur=recs.find(function(r){return r.id===id;});cur.step="contact";view="form";render();}
function delRec(id){if(!confirm("Bu kaydı silmek istediğinizden emin misiniz?"))return;recs=recs.filter(function(r){return r.id!==id;});sr();render();}
function rDetail(){
  var r=cur,secs=fs(r.answers||{}),p=pg(r),pct=p.t?Math.round(p.c/p.t*100):0;
  var qs="";cfg.questions.forEach(function(q){var a=r.answers[q.id];if(!a)return;qs+="<tr><td style='padding:6px 16px 6px 0;font-size:13px;color:#656d76;white-space:nowrap;vertical-align:top'>"+e(q.text)+"</td><td style='padding:6px 0;font-size:14px;font-weight:500'>"+e(Array.isArray(a)?a.join(", "):a)+"</td></tr>";});
  var h="<div id='ss'></div>";
  h+="<div class='dg'>";
  h+="<div class='card'><div class='da'><div class='ava' style='width:48px;height:48px;font-size:15px'>"+e(av(r.contact.name))+"</div><div><div style='font-weight:600;font-size:17px'>"+e(r.contact.name)+"</div><div style='font-size:13px;color:#656d76'>"+e(r.contact.city||"")+"</div></div></div><hr class='dv'><table style='width:100%;border-collapse:collapse'><tr><td class='dk'><i class='ti ti-mail'></i> E-posta</td><td class='dv2'>"+e(r.contact.email)+"</td></tr>"+(r.contact.phone?"<tr><td class='dk'><i class='ti ti-phone'></i> Telefon</td><td class='dv2'>"+e(r.contact.phone)+"</td></tr>":"")+"<tr><td class='dk'><i class='ti ti-calendar'></i> Kayıt</td><td class='dv2'>"+new Date(r.createdAt).toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"})+"</td></tr></table>"+(r.contact.notes?"<hr class='dv'><div style='font-size:13px;color:#656d76'>"+e(r.contact.notes)+"</div>":"")+"</div>";
  h+="<div class='card'><div class='dl'>Müşteri Profili</div>"+(qs?"<table style='width:100%;border-collapse:collapse'>"+qs+"</table>":"<div style='color:#656d76;font-size:14px'>Soru yanıtlanmadı</div>")+"</div></div>";
  h+="<div class='clh'><div style='font-size:16px;font-weight:600'>Check list</div><div style='display:flex;align-items:center;gap:12px'><span style='font-size:14px;color:#656d76'>"+p.c+" / "+p.t+" · "+pct+"%</span><span class='badge "+(r.sent?"badge-green":"badge-yellow")+"'>"+(r.sent?"Gönderildi":"Bekliyor")+"</span></div></div>";
  var all=secs.length?secs:cfg.sections;
  all.forEach(function(sec){
    h+="<div class='card' style='margin-bottom:12px'><div class='sh'><i class='ti "+(sec.icon||"ti-list")+"'></i>"+e(sec.title)+"</div>";
    sec.items.forEach(function(it){h+="<div class='ci'><input type='checkbox' data-iid='"+it.id+"' data-rid='"+r.id+"' class='dchk'"+(r.checklist[it.id]?" checked":"")+">"+"<div style='flex:1'><div class='it'>"+e(it.text)+"</div>"+(it.note?"<div class='in'>"+e(it.note)+"</div>":"")+"</div><span class='tag tag-"+it.tag+"'>"+tl(it.tag)+"</span></div>";});
    h+="</div>";
  });
  return h;
}
function rAdmin(){
  var tabs="<div class='stabs'>";
  [["questions","Sorular"],["sections","Check list"],["webhook","Webhook & Ayarlar"]].forEach(function(t){tabs+="<button class='stab"+(atab===t[0]?" active":"")+"' onclick='atab=\""+t[0]+"\";render()'>"+t[1]+"</button>";});
  return tabs+"</div>"+rAB();
}
function rAB(){if(atab==="questions")return rAQ();if(atab==="sections")return rAS();return rAW();}
function rAQ(){
  var h="<div style='display:flex;justify-content:flex-end;margin-bottom:16px'><button class='btn btn-primary' onclick='addQ()'><i class='ti ti-plus'></i> Soru ekle</button></div>";
  cfg.questions.forEach(function(q,qi){
    h+="<div class='card' style='margin-bottom:12px'><div style='display:flex;gap:12px;align-items:flex-start'><div style='flex:1'><div style='font-weight:600;font-size:15px;margin-bottom:4px'>"+e(q.text)+"</div><div style='font-size:13px;color:#656d76;margin-bottom:12px'>"+(q.type==="multi"?"Çoklu seçim":"Tek seçim")+" · "+q.options.length+" seçenek</div><div>";
    q.options.forEach(function(o,oi){h+="<span style='display:inline-flex;align-items:center;gap:6px;background:#f6f8fa;border:1px solid #d0d7de;border-radius:20px;padding:4px 12px;font-size:13px;margin:0 6px 6px 0'>"+e(o)+"<span style='cursor:pointer;color:#656d76;font-size:16px;line-height:1' onclick='rmOpt("+qi+","+oi+")'>×</span></span>";});
    h+="<span style='display:inline-flex;border:1px dashed #d0d7de;border-radius:20px;padding:4px 12px;font-size:13px;cursor:pointer;color:#656d76' onclick='addOpt("+qi+")'>+ seçenek ekle</span></div></div>";
    h+="<div style='display:flex;gap:6px'><button class='btn btn-sm btn-ghost btn-icon' onclick='editQ("+qi+")'><i class='ti ti-edit'></i></button><button class='btn btn-sm btn-ghost btn-icon' style='color:#cf222e' onclick='delQ("+qi+")'><i class='ti ti-trash'></i></button></div></div></div>";
  });
  return h;
}
function rAS(){
  var h="<div style='display:flex;justify-content:flex-end;margin-bottom:16px'><button class='btn btn-primary' onclick='addSec()'><i class='ti ti-plus'></i> Bölüm ekle</button></div>";
  cfg.sections.forEach(function(sec,si){
    h+="<div class='card' style='margin-bottom:12px'><div style='display:flex;align-items:center;gap:10px;margin-bottom:14px'><i class='ti "+(sec.icon||"ti-list")+"' style='font-size:20px;color:#0969da'></i><div style='font-weight:600;font-size:15px;flex:1'>"+e(sec.title)+"</div><button class='btn btn-sm' onclick='addItem("+si+")'><i class='ti ti-plus'></i> Madde ekle</button><button class='btn btn-sm btn-ghost' style='color:#cf222e' onclick='delSec("+si+")'><i class='ti ti-trash'></i></button></div>";
    sec.items.forEach(function(it,ii){h+="<div class='ai'><div style='flex:1'><div class='it'>"+e(it.text)+"</div>"+(it.note?"<div class='in'>"+e(it.note)+"</div>":"")+(it.cond?"<div style='font-size:12px;color:#656d76;margin-top:3px'><i class='ti ti-filter'></i> "+e(it.cond)+"</div>":"")+"</div><span class='tag tag-"+it.tag+"'>"+tl(it.tag)+"</span><button class='btn btn-sm btn-ghost btn-icon' onclick='editItem("+si+","+ii+")'><i class='ti ti-edit'></i></button><button class='btn btn-sm btn-ghost btn-icon' style='color:#cf222e' onclick='delItem("+si+","+ii+")'><i class='ti ti-trash'></i></button></div>";});
    h+="</div>";
  });
  return h;
}
function rAW(){
  return "<div class='card' style='margin-bottom:16px'><div style='font-weight:600;font-size:15px;margin-bottom:16px'>Webhook ayarları</div><div class='fg'><label class='fl'>Webhook URL</label><input id='whu' value='"+e(cfg.webhookUrl)+"' placeholder='https://hooks.zapier.com/...'></div><div style='font-size:13px;color:#656d76;margin-bottom:16px;line-height:1.6'>Veriler JSON olarak HTTP POST gönderilir. Make, Zapier, n8n ve özel API desteklenir.</div><div style='display:flex;gap:8px'><button class='btn btn-primary' onclick='saveWH()'><i class='ti ti-device-floppy'></i> Kaydet</button><button class='btn' onclick='testWH()'><i class='ti ti-send'></i> Test gönder</button></div><div id='whs' style='margin-top:12px'></div></div>"
  +"<div class='card' style='margin-bottom:16px'><div style='font-weight:600;font-size:15px;margin-bottom:16px'>Güvenlik</div><div class='fg' style='max-width:320px'><label class='fl'>Admin şifresi</label><input id='adpw' type='password' value='"+e(cfg.adminPass)+"'></div><button class='btn btn-primary' onclick='savePW()'><i class='ti ti-device-floppy'></i> Şifreyi güncelle</button></div>"
  +"<div class='card'><div style='font-weight:600;font-size:15px;margin-bottom:12px'>Örnek JSON payload</div><pre style='background:#f6f8fa;border:1px solid #d0d7de;border-radius:6px;padding:16px;overflow-x:auto'>"+e(JSON.stringify({record_id:"u1a2b3",contact:{name:"Ahmet Yılmaz",email:"ahmet@test.com"},answers:{q1:"TC vatandaşı",q3:["Şirket kurmak"]},checklist_summary:{checked:8,total:14}},null,2))+"</pre></div>";
}
function addQ(){var t=prompt("Soru metni:");if(!t)return;var m=confirm("Çoklu seçim mi?");cfg.questions.push({id:uid(),text:t,type:m?"multi":"single",options:[]});sc();render();}
function editQ(qi){var t=prompt("Soru metni:",cfg.questions[qi].text);if(!t)return;cfg.questions[qi].text=t;sc();render();}
function delQ(qi){if(!confirm("Sil?"))return;cfg.questions.splice(qi,1);sc();render();}
function addOpt(qi){var v=prompt("Yeni seçenek:");if(!v)return;cfg.questions[qi].options.push(v);sc();render();}
function rmOpt(qi,oi){cfg.questions[qi].options.splice(oi,1);sc();render();}
function addSec(){var t=prompt("Bölüm başlığı:");if(!t)return;cfg.sections.push({id:uid(),title:t,icon:"ti-list",items:[]});sc();render();}
function delSec(si){if(!confirm("Bölümü sil?"))return;cfg.sections.splice(si,1);sc();render();}
function addItem(si){var t=prompt("Madde metni:");if(!t)return;var tag=prompt("Etiket (req/opt/info):","req")||"req";var note=prompt("Not:","");var cond=prompt("Koşul (örn: q3:Varlık barışı):","");cfg.sections[si].items.push({id:uid(),text:t,tag:tag,note:note||"",cond:cond||""});sc();render();}
function editItem(si,ii){var it=cfg.sections[si].items[ii];var t=prompt("Madde:",it.text);if(!t)return;it.text=t;it.tag=prompt("Etiket:",it.tag)||it.tag;it.note=prompt("Not:",it.note)||"";it.cond=prompt("Koşul:",it.cond||"")||"";sc();render();}
function delItem(si,ii){cfg.sections[si].items.splice(ii,1);sc();render();}
function saveWH(){cfg.webhookUrl=document.getElementById("whu").value.trim();sc();alert("Kaydedildi.");}
function savePW(){var p=document.getElementById("adpw").value.trim();if(!p){alert("Boş olamaz.");return;}cfg.adminPass=p;sc();alert("Güncellendi.");}
async function testWH(){
  var url=document.getElementById("whu").value.trim();if(!url){alert("URL girin.");return;}
  var el=document.getElementById("whs");el.innerHTML="<div class='alert alert-info'><i class='ti ti-loader'></i> Gönderiliyor...</div>";
  try{await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({test:true,ts:new Date().toISOString()}),mode:"no-cors"});el.innerHTML="<div class='alert alert-success'><i class='ti ti-check'></i> Gönderildi</div>";}
  catch(ex){el.innerHTML="<div class='alert alert-error'><i class='ti ti-x'></i> Hata: "+ex.message+"</div>";}
}
async function sendWH(){
  var r=cur,el=document.getElementById("ss");
  if(!cfg.webhookUrl){el.innerHTML="<div class='alert alert-warn'><i class='ti ti-alert-triangle'></i> Webhook URL tanımlı değil.</div>";return;}
  el.innerHTML="<div class='alert alert-info'><i class='ti ti-loader'></i> Gönderiliyor...</div>";
  var p=pg(r),items={};cfg.sections.forEach(function(s){s.items.forEach(function(it){items[it.id]={text:it.text,tag:it.tag,checked:!!(r.checklist&&r.checklist[it.id])};});});
  try{
    await fetch(cfg.webhookUrl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({record_id:r.id,created_at:r.createdAt,sent_at:new Date().toISOString(),contact:r.contact,answers:r.answers,checklist_summary:{checked:p.c,total:p.t},checklist_items:items}),mode:"no-cors"});
    r.sent=true;r.sentAt=new Date().toISOString();sr();
    el.innerHTML="<div class='alert alert-success'><i class='ti ti-check'></i> Gönderildi — "+new Date().toLocaleTimeString("tr-TR")+"</div>";
  }catch(ex){el.innerHTML="<div class='alert alert-error'><i class='ti ti-x'></i> Hata: "+ex.message+"</div>";}
}
function attachEv(){
  document.querySelectorAll(".pill").forEach(function(el){
    el.addEventListener("click",function(){
      var qid=el.dataset.qid,val=el.dataset.val,type=el.dataset.type;
      if(type==="single"){cur.answers[qid]=val;el.parentNode.querySelectorAll(".pill").forEach(function(p){p.classList.remove("sel");});el.classList.add("sel");}
      else{if(!cur.answers[qid])cur.answers[qid]=[];var arr=cur.answers[qid],i=arr.indexOf(val);if(i>-1){arr.splice(i,1);el.classList.remove("sel");}else{arr.push(val);el.classList.add("sel");}}
    });
  });
  document.querySelectorAll("input[data-iid]").forEach(function(el){
    el.addEventListener("change",function(){
      var iid=el.dataset.iid,rid=el.dataset.rid;
      if(rid){var rec=recs.find(function(r){return r.id===rid;});if(rec){rec.checklist[iid]=el.checked;sr();}}
      else if(cur)cur.checklist[iid]=el.checked;
    });
  });
}

document.addEventListener("DOMContentLoaded", boot);
</script>
