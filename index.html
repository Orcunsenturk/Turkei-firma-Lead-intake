<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TR Danışmanlık — Müşteri Intake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F4F0;
  --surface:#FFFFFF;
  --surface2:#F0EEE9;
  --surface3:#E8E6E0;
  --border:#E2DFD8;
  --border-strong:#C8C5BC;
  --text:#1C1B18;
  --text-2:#6B6860;
  --text-3:#A09D96;
  --accent:#1A4F8A;
  --accent-light:#E8F0FA;
  --accent-mid:#2E6BB5;
  --green:#2D6611;
  --green-light:#ECF5E2;
  --red:#8C2424;
  --red-light:#FAEAEA;
  --amber:#7A4500;
  --amber-light:#FDF0DC;
  --r:10px;--r-sm:6px;--r-lg:14px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.06);
  --shadow-sm:0 1px 3px rgba(0,0,0,.06);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#141412;--surface:#1E1D1A;--surface2:#252420;--surface3:#2C2B27;
  --border:#2E2D28;--border-strong:#3E3D38;
  --text:#F0EDE6;--text-2:#9C9890;--text-3:#605E58;
  --accent:#4A8FD4;--accent-light:#0F2540;--accent-mid:#6AABF0;
  --green:#5DA832;--green-light:#0E2606;
  --red:#E05858;--red-light:#2A0A0A;
  --amber:#E09840;--amber-light:#2A1800;
  --shadow:0 1px 2px rgba(0,0,0,.2),0 4px 12px rgba(0,0,0,.3);
}}
body{font-family:'DM Sans',system-ui,sans-serif;font-size:14px;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
.shell{display:flex;min-height:100vh}

/* Sidebar */
.sidebar{width:240px;background:var(--surface);border-right:1px solid var(--border);padding:0;flex-shrink:0;position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:10}
.sb-brand{padding:24px 20px 16px;border-bottom:1px solid var(--border)}
.sb-brand-name{font-family:'DM Serif Display',serif;font-size:18px;color:var(--accent);letter-spacing:-.01em}
.sb-brand-sub{font-size:11px;color:var(--text-3);margin-top:3px;letter-spacing:.04em;text-transform:uppercase}
.sb-section{padding:20px 12px 8px;font-size:10px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-sm);cursor:pointer;font-size:13px;color:var(--text-2);transition:all .12s;border:none;background:none;width:100%;text-align:left;font-family:inherit;font-weight:400;margin-bottom:1px}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--accent-light);color:var(--accent);font-weight:500}
.nav-item .ti{font-size:16px;flex-shrink:0}
.sb-footer{margin-top:auto;padding:16px;border-top:1px solid var(--border)}
.sb-footer-txt{font-size:11px;color:var(--text-3);line-height:1.5}

/* Main */
.main{margin-left:240px;padding:0;flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
.topbar-title{font-size:15px;font-weight:500}
.topbar-sub{font-size:12px;color:var(--text-3);margin-top:1px}
.content{padding:28px;flex:1}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px 22px;box-shadow:var(--shadow-sm)}
.card-sm{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}

/* Metric cards */
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px}
.metric{background:var(--surface2);border-radius:var(--r);padding:14px 16px}
.metric-label{font-size:11px;color:var(--text-3);font-weight:500;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.metric-val{font-size:26px;font-weight:600;color:var(--text);line-height:1}
.metric-val.accent{color:var(--accent)}
.metric-val.green{color:var(--green)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;font-size:13px;font-weight:500;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer;transition:all .12s;font-family:inherit;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface2);border-color:var(--border-strong)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-mid);border-color:var(--accent-mid);color:#fff}
.btn-danger{background:var(--red);border-color:var(--red);color:#fff}
.btn-danger:hover{background:#6B1A1A;color:#fff}
.btn-success{background:var(--green);border-color:var(--green);color:#fff}
.btn-success:hover{background:#1F4A0A;color:#fff}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--surface2);border-color:var(--border)}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-icon{padding:7px 9px}

/* Inputs */
input,select,textarea{font-family:'DM Sans',inherit;font-size:13px;background:var(--surface);color:var(--text);border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:9px 12px;width:100%;outline:none;transition:border-color .12s,box-shadow .12s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(26,79,138,.12)}
textarea{resize:vertical;min-height:72px}
.form-label{display:block;font-size:12px;font-weight:500;color:var(--text-2);margin-bottom:5px}
.form-group{margin-bottom:14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}

/* Tags */
.tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:4px;font-size:11px;font-weight:600;white-space:nowrap}
.tag-req{background:var(--red-light);color:var(--red)}
.tag-opt{background:var(--green-light);color:var(--green)}
.tag-info{background:var(--accent-light);color:var(--accent)}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-blue{background:var(--accent-light);color:var(--accent)}
.badge-green{background:var(--green-light);color:var(--green)}
.badge-amber{background:var(--amber-light);color:var(--amber)}
.badge-red{background:var(--red-light);color:var(--red)}
.badge-gray{background:var(--surface3);color:var(--text-2)}

/* Alerts */
.alert{padding:11px 14px;border-radius:var(--r-sm);font-size:13px;margin-bottom:14px;display:flex;align-items:flex-start;gap:9px;line-height:1.5}
.alert .ti{font-size:16px;flex-shrink:0;margin-top:1px}
.alert-warn{background:var(--amber-light);color:var(--amber);border:1px solid #E8AA40}
.alert-success{background:var(--green-light);color:var(--green);border:1px solid #6AB830}
.alert-error{background:var(--red-light);color:var(--red);border:1px solid #D45050}
.alert-info{background:var(--accent-light);color:var(--accent);border:1px solid #5A96D8}

/* Record rows */
.record-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .14s;margin-bottom:8px}
.record-row:hover{border-color:var(--border-strong);box-shadow:var(--shadow);transform:translateY(-1px)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--accent);flex-shrink:0;letter-spacing:-.02em}

/* Steps */
.steps{display:flex;gap:0;margin-bottom:24px;background:var(--surface2);border-radius:var(--r);padding:4px}
.step-item{flex:1;text-align:center;padding:8px 12px;font-size:13px;color:var(--text-3);border-radius:var(--r-sm);transition:all .14s;font-weight:400}
.step-item.active{background:var(--surface);color:var(--accent);font-weight:500;box-shadow:var(--shadow-sm)}
.step-item.done{color:var(--green)}

/* Option pills */
.opt-pill{display:inline-flex;align-items:center;gap:7px;padding:7px 15px;border:1px solid var(--border-strong);border-radius:20px;cursor:pointer;font-size:13px;background:var(--surface2);color:var(--text-2);transition:all .12s;user-select:none;font-family:inherit}
.opt-pill:hover{border-color:var(--accent);color:var(--text);background:var(--surface)}
.opt-pill.sel{background:var(--accent-light);border-color:var(--accent);color:var(--accent);font-weight:500}

/* Checklist */
.cl-item{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-bottom:1px solid var(--border)}
.cl-item:last-child{border-bottom:none}
.cl-item input[type=checkbox]{width:16px;height:16px;flex-shrink:0;margin-top:2px;accent-color:var(--accent);cursor:pointer;border-radius:3px}
.cl-note{font-size:12px;color:var(--text-3);margin-top:3px}

/* Section header */
.sec-hdr{display:flex;align-items:center;gap:9px;font-weight:600;font-size:13px;color:var(--accent);margin-bottom:12px}
.sec-hdr .ti{font-size:16px}

/* Admin */
.sub-tabs{display:flex;gap:0;margin-bottom:20px;border-bottom:1px solid var(--border)}
.sub-tab{padding:9px 18px;font-size:13px;cursor:pointer;border:none;background:none;color:var(--text-2);border-bottom:2px solid transparent;transition:all .12s;font-family:'DM Sans',inherit;font-weight:400}
.sub-tab:hover{color:var(--text)}
.sub-tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.admin-item{display:flex;align-items:flex-start;gap:9px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-sm);margin-bottom:6px;background:var(--surface);transition:border-color .12s}
.admin-item:hover{border-color:var(--border-strong)}

/* Progress */
.prog-bar{height:4px;background:var(--surface3);border-radius:2px;overflow:hidden;margin-top:7px;max-width:200px}
.prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .4s}

/* Divider */
.divider{border:none;border-top:1px solid var(--border);margin:16px 0}

pre{white-space:pre-wrap;word-break:break-all;font-family:monospace}

@media(max-width:768px){
  .sidebar{width:100%;height:auto;position:relative;flex-direction:row;flex-wrap:wrap;padding:12px}
  .main{margin-left:0}
  .form-row,.form-row-3{grid-template-columns:1fr}
  .content{padding:16px}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="sb-brand">
      <div class="sb-brand-name">TR Danışmanlık</div>
      <div class="sb-brand-sub">Müşteri Intake Sistemi</div>
    </div>
    <div style="padding:8px 12px;flex:1">
      <div class="sb-section">Menü</div>
      <button class="nav-item active" id="nav-records" onclick="navigate('records')">
        <i class="ti ti-users"></i> Kayıtlar
      </button>
      <button class="nav-item" id="nav-admin" onclick="tryAdmin()">
        <i class="ti ti-settings-2"></i> Yönetim
      </button>
    </div>
    <div class="sb-footer">
      <div class="sb-footer-txt">Veriler bu tarayıcıda saklanır.<br>Webhook ile dışarı aktarın.</div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div>
        <div class="topbar-title" id="topbar-title">Kayıtlar</div>
        <div class="topbar-sub" id="topbar-sub">Tüm müşteri kayıtları</div>
      </div>
      <div id="topbar-actions"></div>
    </div>
    <div class="content" id="main-content"></div>
  </div>
</div>

<script>
const KEY_CFG='tr_intake_v4_cfg',KEY_REC='tr_intake_v4_rec';
const DCFG={
  adminPass:'admin123',webhookUrl:'',
  questions:[
    {id:'q1',text:'Vatandaşlık / uyruk',type:'single',options:['TC vatandaşı','AB ülkesi','Diğer yabancı uyruk','Çift vatandaş']},
    {id:'q2',text:'Şu an nerede ikamet ediyor?',type:'single',options:['Yurt dışında','Türkiye\'de']},
    {id:'q3',text:'Hedef (birden fazla seçilebilir)',type:'multi',options:['Şirket kurmak','Türkiye\'ye yerleşmek','Vergi optimizasyonu','Varlık barışı']},
    {id:'q4',text:'Yapı türü',type:'single',options:['Şahıs / serbest meslek','Limited şirket (Ltd.)','Anonim şirket (A.Ş.)','Henüz bilmiyor']},
    {id:'q5',text:'Faaliyet alanı',type:'single',options:['Teknoloji / yazılım / dijital','Ticaret / ithalat-ihracat','Danışmanlık / profesyonel hizmet','Gayrimenkul / yatırım','Diğer']},
    {id:'q6',text:'Gelirin kaynağı',type:'single',options:['Yalnızca yurt dışı müşteriler','Hem yurt dışı hem Türkiye','Yalnızca Türkiye']},
  ],
  sections:[
    {id:'s1',title:'Kimlik & Kişisel Belgeler',icon:'ti-id',items:[
      {id:'i1',text:'Pasaport (geçerlilik min. 6 ay)',tag:'req',note:'',cond:''},
      {id:'i2',text:'TC kimlik kartı',tag:'req',note:'Yalnızca TC vatandaşları için',cond:'q1:TC vatandaşı'},
      {id:'i3',text:'Apostilli nüfus kayıt belgesi + noter onaylı Türkçe tercümesi',tag:'req',note:'Yabancı uyruklu gerçek kişiler için',cond:'q1:AB ülkesi|q1:Diğer yabancı uyruk|q1:Çift vatandaş'},
      {id:'i4',text:'Vergi numarası başvurusu (yabancı gerçek kişi)',tag:'req',note:'Herhangi bir vergi dairesine bizzat başvuru',cond:'q1:AB ülkesi|q1:Diğer yabancı uyruk'},
      {id:'i5',text:'İkametgah belgesi / adres teyit (mevcut ülkeden)',tag:'req',note:'',cond:''},
      {id:'i6',text:'Biyometrik fotoğraf (6 ay içinde çekilmiş, 4 adet)',tag:'req',note:'',cond:''},
    ]},
    {id:'s2',title:'Şirket Kuruluşu — Şahıs',icon:'ti-user-circle',items:[
      {id:'i10',text:'Vergi dairesi mükellefiyet kaydı',tag:'req',note:'',cond:'q4:Şahıs / serbest meslek'},
      {id:'i11',text:'Meslek odası kaydı (faaliyet alanına göre)',tag:'opt',note:'',cond:'q4:Şahıs / serbest meslek'},
      {id:'i12',text:'Serbest meslek makbuz defteri / e-SMM aktivasyonu',tag:'req',note:'',cond:'q4:Şahıs / serbest meslek'},
    ]},
    {id:'s3',title:'Şirket Kuruluşu — Ltd. / A.Ş.',icon:'ti-building',items:[
      {id:'i20',text:'Şirket ana sözleşmesi (noter onaylı)',tag:'req',note:'',cond:'q4:Limited şirket (Ltd.)|q4:Anonim şirket (A.Ş.)'},
      {id:'i21',text:'Ticaret Sicili tescil başvurusu (MERSİS)',tag:'req',note:'https://mersis.gtb.gov.tr',cond:'q4:Limited şirket (Ltd.)|q4:Anonim şirket (A.Ş.)'},
      {id:'i22',text:'Sermaye banka blokaj mektubu',tag:'req',note:'Ltd min. 10.000 TL / A.Ş. min. 50.000 TL',cond:'q4:Limited şirket (Ltd.)|q4:Anonim şirket (A.Ş.)'},
      {id:'i23',text:'İmza sirküleri (noter onaylı)',tag:'req',note:'',cond:'q4:Limited şirket (Ltd.)|q4:Anonim şirket (A.Ş.)'},
      {id:'i24',text:'Tüm ortakların vergi numaraları',tag:'req',note:'',cond:'q4:Limited şirket (Ltd.)|q4:Anonim şirket (A.Ş.)'},
      {id:'i25',text:'Şirket adresi belgesi (sanal ofis / kira sözleşmesi)',tag:'req',note:'',cond:''},
      {id:'i26',text:'Muhasebeci / mali müşavir sözleşmesi',tag:'req',note:'',cond:''},
      {id:'i27',text:'Yabancı ortak apostilli kimlik belgesi + Türkçe tercüme',tag:'req',note:'',cond:'q1:AB ülkesi|q1:Diğer yabancı uyruk|q1:Çift vatandaş'},
    ]},
    {id:'s4',title:'İkamet İzni',icon:'ti-home',items:[
      {id:'i30',text:'İkamet izni başvuru formu (e-ikamet)',tag:'req',note:'https://e-ikamet.goc.gov.tr — online randevu zorunlu',cond:'q3:Türkiye\'ye yerleşmek'},
      {id:'i31',text:'Pasaport Türkçe noter tercümesi',tag:'req',note:'',cond:'q3:Türkiye\'ye yerleşmek'},
      {id:'i32',text:'Kira sözleşmesi veya tapu (adres belgesi)',tag:'req',note:'',cond:'q3:Türkiye\'ye yerleşmek'},
      {id:'i33',text:'Geçim kaynağını gösterir belge',tag:'req',note:'Banka ekstresi / gelir belgesi / şirket ortaklık belgesi',cond:'q3:Türkiye\'ye yerleşmek'},
      {id:'i34',text:'Sağlık sigortası poliçesi (Türkiye geçerli, tüm süre)',tag:'req',note:'Özel SGK muafiyeti sigortası yeterli olabilir',cond:'q3:Türkiye\'ye yerleşmek'},
      {id:'i35',text:'İkamet harcı ödeme makbuzu',tag:'req',note:'',cond:'q3:Türkiye\'ye yerleşmek'},
    ]},
    {id:'s5',title:'Vergi Muafiyeti & Optimizasyon',icon:'ti-receipt-tax',items:[
      {id:'i40',text:'Yurt dışı faaliyet gelir belgesi / imzalı sözleşmeler',tag:'req',note:'Hizmetin yurt dışında kullanıldığını ispat için',cond:'q3:Vergi optimizasyonu'},
      {id:'i41',text:'Yabancı müşteri ödeme kayıtları (SWIFT / havale)',tag:'req',note:'',cond:'q3:Vergi optimizasyonu'},
      {id:'i42',text:'Döviz geliri banka ekstresi',tag:'req',note:'',cond:'q3:Vergi optimizasyonu'},
      {id:'i43',text:'KV %50 indirim dilekçesi (yurt dışı hizmet)',tag:'req',note:'Hizmetin münhasıran yurt dışında kullanılması şartı',cond:'q3:Vergi optimizasyonu'},
      {id:'i44',text:'ÇVÖ anlaşması değerlendirmesi (çifte vergilendirme)',tag:'opt',note:'Türkiye 90+ ülkeyle anlaşma imzalamış',cond:'q3:Vergi optimizasyonu'},
      {id:'i45',text:'Mali müşavir vergi optimizasyon raporu',tag:'opt',note:'',cond:'q3:Vergi optimizasyonu'},
    ]},
    {id:'s6',title:'Varlık Barışı',icon:'ti-safe',items:[
      {id:'i50',text:'Yurt dışı varlık envanteri (banka, gayrimenkul, menkul)',tag:'req',note:'',cond:'q3:Varlık barışı'},
      {id:'i51',text:'Varlık kaynağını ispat belgeleri',tag:'req',note:'Banka ekstresi, tapu, hisse senedi vb.',cond:'q3:Varlık barışı'},
      {id:'i52',text:'Türkiye banka hesabı (transfer için)',tag:'req',note:'',cond:'q3:Varlık barışı'},
      {id:'i53',text:'Vergi dairesi varlık barışı beyan formu',tag:'req',note:'',cond:'q3:Varlık barışı'},
      {id:'i54',text:'%3 vergi ödeme makbuzu',tag:'req',note:'Güncel oran ve son tarihi teyit ediniz',cond:'q3:Varlık barışı'},
      {id:'i55',text:'Mali müşavir beyanı ve imzası',tag:'req',note:'',cond:'q3:Varlık barışı'},
    ]},
    {id:'s7',title:'Genel Kontroller',icon:'ti-clipboard-check',items:[
      {id:'i60',text:'Tüm yabancı belgelerin apostil / konsolosluk onayı',tag:'req',note:'',cond:''},
      {id:'i61',text:'Yeminli tercüman onaylı Türkçe çeviriler',tag:'req',note:'',cond:''},
      {id:'i62',text:'Belge geçerlilik tarihleri kontrolü (min. 6 ay)',tag:'req',note:'',cond:''},
      {id:'i63',text:'Vekâletname (danışman adına işlem yapılacaksa)',tag:'opt',note:'Noterden + apostil gerekebilir',cond:''},
      {id:'i64',text:'Mali müşavir ve avukat görevlendirmesi',tag:'req',note:'',cond:''},
    ]},
  ]
};

let cfg=()=>{try{const s=localStorage.getItem(KEY_CFG);return s?JSON.parse(s):JSON.parse(JSON.stringify(DCFG))}catch{return JSON.parse(JSON.stringify(DCFG))}}();
let records=()=>{try{const s=localStorage.getItem(KEY_REC);return s?JSON.parse(s):[]}catch{return []}}();
let view='records',curRec=null,adminAuthed=false,adminTab='questions';

function saveCfg(){localStorage.setItem(KEY_CFG,JSON.stringify(cfg))}
function saveRec(){localStorage.setItem(KEY_REC,JSON.stringify(records))}
function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}

function navigate(v){
  view=v;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  const n=document.getElementById('nav-'+v);
  if(n)n.classList.add('active');
  render();
}

function tryAdmin(){

function matchCond(it,ans){
  if(!it.cond)return true;
  return it.cond.split('|').some(p=>{const[qid,v]=p.split(':');const a=ans[qid];if(!a)return false;return Array.isArray(a)?a.includes(v):a===v;});
}
function filtSecs(ans){return cfg.sections.map(s=>({...s,items:s.items.filter(it=>matchCond(it,ans))})).filter(s=>s.items.length>0);}
function inits(name){return(name||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();}
function tagLbl(t){return t==='req'?'Zorunlu':t==='opt'?'Önerilen':'Bilgi';}
function countProg(rec){
  const secs=filtSecs(rec.answers||{});const all=secs.length?secs:cfg.sections;
  let total=0,checked=0;all.forEach(s=>s.items.forEach(it=>{total++;if(rec.checklist&&rec.checklist[it.id])checked++;}));
  return{total,checked};
}

function renderRecords(){
  const total=records.length;
  const sent=records.filter(r=>r.sent).length;
  const pending=total-sent;
  if(!total)return`<div style="text-align:center;padding:4rem 1rem;color:var(--text-3)"><i class="ti ti-users" style="font-size:48px;display:block;margin-bottom:16px;opacity:.3"></i><div style="font-size:16px;font-weight:500;color:var(--text-2);margin-bottom:6px">Henüz kayıt yok</div><div style="font-size:13px;margin-bottom:20px">Yeni kayıt butonuyla başlayın</div><button class="btn btn-primary" onclick="startNew()"><i class="ti ti-plus"></i> Yeni kayıt oluştur</button></div>`;

  return`<div class="metric-grid">
    <div class="metric"><div class="metric-label">Toplam</div><div class="metric-val">${total}</div></div>
    <div class="metric"><div class="metric-label">Gönderildi</div><div class="metric-val green">${sent}</div></div>
    <div class="metric"><div class="metric-label">Bekliyor</div><div class="metric-val accent">${pending}</div></div>
  </div>
  ${records.map(r=>{
    const{checked,total:tot}=countProg(r);
    const pct=tot?Math.round(checked/tot*100):0;
    const goals=r.answers&&r.answers.q3?[].concat(r.answers.q3):[];
    return`<div class="record-row" onclick="openRec('${r.id}')">
      <div class="avatar">${inits(r.contact.name)}</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:500;font-size:14px;margin-bottom:2px">${r.contact.name||'İsimsiz'}</div>
        <div style="font-size:12px;color:var(--text-3)">${r.contact.email||''}${r.contact.phone?' · '+r.contact.phone:''}</div>
        ${goals.length?`<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px">${goals.map(g=>`<span class="badge badge-gray" style="font-size:10px;padding:2px 8px">${g}</span>`).join('')}</div>`:''}
        <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">
        <div style="text-align:right"><div style="font-size:12px;color:var(--text-2);font-weight:500">${checked}/${tot}</div><div style="font-size:11px;color:var(--text-3)">${pct}%</div></div>
        <span class="badge ${r.sent?'badge-green':'badge-amber'}">${r.sent?'Gönderildi':'Bekliyor'}</span>
        <span style="font-size:12px;color:var(--text-3)">${new Date(r.createdAt).toLocaleDateString('tr-TR',{day:'2-digit',month:'short'})}</span>
        <button class="btn btn-ghost btn-sm btn-icon" onclick="event.stopPropagation();editRec('${r.id}')"><i class="ti ti-edit" style="font-size:14px"></i></button>
        <button class="btn btn-ghost btn-sm btn-icon" style="color:var(--red)" onclick="event.stopPropagation();delRec('${r.id}')"><i class="ti ti-trash" style="font-size:14px"></i></button>
      </div>
    </div>`;
  }).join('')}`;
}

function formBack(){const steps=['contact','questions','checklist'];const i=steps.indexOf(curRec.step);if(i>0){curRec.step=steps[i-1];render();}}
function formNext(){
  const steps=['contact','questions','checklist'];const i=steps.indexOf(curRec.step);
  if(i===0){
    const name=document.getElementById('f_name').value.trim();
    const email=document.getElementById('f_email').value.trim();
    if(!name||!email){alert('Ad soyad ve e-posta zorunludur.');return;}
    curRec.contact={name,email,phone:document.getElementById('f_phone').value.trim(),city:document.getElementById('f_city').value.trim(),notes:document.getElementById('f_notes').value.trim()};
    curRec.step='questions';render();
  }else if(i===1){curRec.step='checklist';render();}
  else{
    const ex=records.findIndex(r=>r.id===curRec.id);
    if(ex>-1)records[ex]=curRec;else records.unshift(curRec);
    saveRec();view='detail';render();
  }
}

  const t=prompt('Madde metni:');if(!t)return;
  const tag=prompt('Etiket (req/opt/info):','req')||'req';
  const note=prompt('Not (boş bırakılabilir):','')||'';
  const cond=prompt('Koşul (örn: q3:Varlık barışı, boş=her zaman):','')||'';
  cfg.sections[si].items.push({id:uid(),text:t,tag,note,cond});saveCfg();render();
}
function editItem(si,ii){
  const it=cfg.sections[si].items[ii];
  const t=prompt('Madde metni:',it.text);if(!t)return;
  it.text=t;it.tag=prompt('Etiket:',it.tag)||it.tag;
  it.note=prompt('Not:',it.note)||'';it.cond=prompt('Koşul:',it.cond||'')||'';
  saveCfg();render();
}
function delItem(si,ii){cfg.sections[si].items.splice(ii,1);saveCfg();render();}
function saveWH(){cfg.webhookUrl=document.getElementById('wh_url').value.trim();saveCfg();alert('Kaydedildi.');}
function savePW(){const p=document.getElementById('adm_pw').value.trim();if(!p){alert('Boş olamaz.');return;}cfg.adminPass=p;saveCfg();alert('Şifre güncellendi.');}
async function testWH(){
  const url=document.getElementById('wh_url').value.trim();if(!url){alert('Önce URL girin.');return;}
  const el=document.getElementById('wh-status');
  el.innerHTML=`<div class="alert alert-info"><i class="ti ti-loader"></i> Gönderiliyor...</div>`;
  try{await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({test:true,source:'tr_intake',ts:new Date().toISOString()}),mode:'no-cors'});
  el.innerHTML=`<div class="alert alert-success"><i class="ti ti-check"></i> İstek gönderildi — endpoint'inizde kontrol edin</div>`;}
  catch(e){el.innerHTML=`<div class="alert alert-error"><i class="ti ti-x"></i> Hata: ${e.message}</div>`;}
}

async function sendWH(id){
  const r=records.find(x=>x.id===id);if(!r)return;
  const el=document.getElementById('send-status');
  if(!cfg.webhookUrl){el.innerHTML=`<div class="alert alert-warn"><i class="ti ti-alert-triangle"></i> Webhook URL tanımlı değil. Yönetim > Webhook & Ayarlar bölümünden ekleyin.</div>`;return;}
  el.innerHTML=`<div class="alert alert-info"><i class="ti ti-loader"></i> Gönderiliyor...</div>`;
  const{checked,total}=countProg(r);
  const items={};cfg.sections.forEach(s=>s.items.forEach(it=>{items[it.id]={text:it.text,tag:it.tag,checked:!!r.checklist[it.id]};}));
  const payload={record_id:r.id,created_at:r.createdAt,sent_at:new Date().toISOString(),contact:r.contact,answers:r.answers,checklist_summary:{checked,total},checklist_items:items};
  try{
    await fetch(cfg.webhookUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),mode:'no-cors'});
    r.sent=true;r.sentAt=new Date().toISOString();saveRec();
    el.innerHTML=`<div class="alert alert-success"><i class="ti ti-check"></i> Başarıyla gönderildi — ${new Date().toLocaleTimeString('tr-TR')}</div>`;
  }catch(e){el.innerHTML=`<div class="alert alert-error"><i class="ti ti-x"></i> Hata: ${e.message}</div>`;}
}

function attachEv(){
  document.querySelectorAll('.opt-pill').forEach(el=>{
    el.addEventListener('click',()=>{
      const qid=el.dataset.qid,val=el.dataset.val,type=el.dataset.type;
      if(type==='single'){curRec.answers[qid]=val;el.closest('[style*="flex-wrap"]').querySelectorAll('.opt-pill').forEach(p=>p.classList.remove('sel'));el.classList.add('sel');}
      else{if(!curRec.answers[qid])curRec.answers[qid]=[];const arr=curRec.answers[qid];const i=arr.indexOf(val);if(i>-1){arr.splice(i,1);el.classList.remove('sel');}else{arr.push(val);el.classList.add('sel');}}
    });
  });
  document.querySelectorAll('input[data-iid]').forEach(el=>{
    el.addEventListener('change',()=>{
      const iid=el.dataset.iid,rid=el.dataset.rid;
      if(rid){const rec=records.find(r=>r.id===rid);if(rec){rec.checklist[iid]=el.checked;saveRec();}}
      else if(curRec)curRec.checklist[iid]=el.checked;
    });
  });
}

render();
</script>
